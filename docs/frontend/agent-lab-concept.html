<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Agent Lab — разбор ошибок · концепт</title>
  <style>
    :root {
      --page: #171a1e; --surface: #1e2227; --elevated: #252a30; --sidebar: #121519;
      --text: #eef0f1; --secondary: #bcc3cb; --muted: #a0a9b4; --subtle: #858f9c;
      --border: #333940; --border-soft: #2a3037; --accent: #efaf77; --accent-strong: #f5bd8c;
      --accent-ink: #24190f; --accent-wash: #352b24; --success: #9cc9b3; --success-wash: #21332a;
      --warning: #e8b582; --warning-wash: #352b23; --error: #f3a29b; --error-wash: #3b2828;
      --focus: #f4bb88; --quote-highlight: #4d3627; --shadow: 0 22px 80px #0007;
      --radius: 10px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    :root[data-theme="light"] {
      --page: #f5f3ef; --surface: #fffefa; --elevated: #ece9e3; --sidebar: #eeeae3;
      --text: #232725; --secondary: #4d5655; --muted: #606c6a; --subtle: #697371;
      --border: #d3d4cb; --border-soft: #e0dfd7; --accent: #905021; --accent-strong: #a65a23;
      --accent-ink: #fffaf3; --accent-wash: #f0e5d6; --success: #2e644b; --success-wash: #e5efe6;
      --warning: #805023; --warning-wash: #f5eadb; --error: #9a3e35; --error-wash: #f9e7e3;
      --focus: #945320; --quote-highlight: #f1d8be; --shadow: 0 22px 80px #28302722;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-width: 280px; }
    body { margin: 0; background: var(--page); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    button, a, select, input, textarea { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button { border: 0; background: none; }
    a { color: var(--accent); }
    p, h1, h2, h3 { margin: 0; }
    h1 { font-size: 29px; letter-spacing: -.9px; line-height: 1.2; font-weight: 620; }
    h2 { font-size: 20px; font-weight: 600; letter-spacing: -.4px; line-height: 1.35; }
    h3 { font-size: 14px; font-weight: 600; }
    svg { width: 18px; height: 18px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .sprite { display: none; }
    .shell { display: grid; grid-template-columns: 184px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { background: var(--sidebar); border-right: 1px solid var(--border-soft); padding: 29px 14px 18px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 18px; font-weight: 650; letter-spacing: -.5px; }
    .brand-mark { width: 24px; height: 24px; color: var(--accent); stroke-width: 1.7; }
    .workspace-label { margin: 42px 12px 13px; color: var(--subtle); font-size: 10px; letter-spacing: 1.2px; font-weight: 650; text-transform: uppercase; }
    .nav { display: flex; flex-direction: column; gap: 5px; }
    .nav-button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; color: var(--muted); border-radius: 7px; position: relative; text-align: left; font-weight: 500; min-height: 44px; }
    .nav-button:hover { background: var(--surface); color: var(--text); }
    .nav-button[aria-current="page"] { background: var(--accent-wash); color: var(--accent); }
    .nav-button[aria-current="page"]::before { content: ""; position: absolute; width: 2px; height: 18px; background: var(--accent); left: -14px; top: 13px; border-radius: 2px; }
    .sidebar-bottom { margin-top: auto; padding: 16px 11px 0; border-top: 1px solid var(--border-soft); }
    .workspace-person { display: flex; gap: 10px; align-items: center; }
    .avatar { width: 28px; height: 28px; border-radius: 7px; background: var(--elevated); border: 1px solid var(--border); display: grid; place-items: center; color: var(--secondary); font-size: 11px; font-weight: 650; }
    .person-label { font-size: 12px; color: var(--secondary); }
    .person-caption { font-size: 11px; color: var(--subtle); }
    .main { min-width: 0; }
    .demo-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; background: var(--sidebar); border-bottom: 1px solid var(--border-soft); padding: 8px 32px; color: var(--muted); font-size: 11px; min-height: 37px; }
    .demo-label { display: flex; align-items: center; gap: 7px; }
    .demo-label svg { width: 13px; height: 13px; color: var(--accent); }
    .demo-controls { display: flex; align-items: center; gap: 10px; }
    .demo-toggle { display: none; }
    .demo-controls label { white-space: nowrap; }
    .demo-controls select { max-width: 180px; color: var(--secondary); background: var(--sidebar); border: 1px solid var(--border); border-radius: 5px; padding: 3px 24px 3px 7px; min-height: 26px; font-size: 11px; }
    .theme-button { display: grid; place-items: center; border: 1px solid var(--border); border-radius: 5px; width: 28px; height: 28px; color: var(--secondary); }
    .theme-button:hover { background: var(--elevated); }
    .theme-button svg { width: 14px; height: 14px; }
    .topbar { padding: 14px 32px 13px; display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-soft); }
    .agent-name { display: flex; align-items: center; gap: 11px; font-size: 16px; font-weight: 570; }
    .agent-icon { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; color: var(--secondary); }
    .agent-caption { font-size: 11px; color: var(--subtle); margin-top: 3px; font-weight: 400; }
    .source-picker { display: flex; align-items: center; gap: 12px; }
    .source-label { color: var(--muted); font-size: 12px; }
    .segmented { display: flex; border: 1px solid var(--border); background: var(--sidebar); border-radius: 7px; padding: 3px; gap: 3px; }
    .segment { padding: 6px 12px; color: var(--muted); border-radius: 4px; font-size: 12px; line-height: 1.5; min-height: 31px; display: flex; align-items: center; gap: 7px; }
    .segment svg { width: 14px; height: 14px; }
    .segment[aria-pressed="true"] { background: var(--elevated); color: var(--text); box-shadow: 0 1px 4px #0002; }
    .content { padding: 16px 32px 40px; max-width: 1540px; margin: 0 auto; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .page-description { margin-top: 6px; color: var(--muted); font-size: 13px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 36px; border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; font-weight: 530; font-size: 12px; color: var(--secondary); background: var(--surface); line-height: 1.4; white-space: normal; text-align: center; }
    .button:hover { background: var(--elevated); color: var(--text); border-color: var(--subtle); }
    .button svg { width: 15px; height: 15px; }
    .button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .button.quiet { background: transparent; }
    .button.small { min-height: 29px; padding: 5px 8px; font-size: 11px; }
    .summary { margin-top: 12px; padding: 7px 0; display: flex; gap: 28px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); }
    .summary-metric { display: flex; align-items: baseline; gap: 7px; }
    .summary-metric strong { font-size: 19px; line-height: 1.3; letter-spacing: -.4px; font-weight: 550; font-variant-numeric: tabular-nums; }
    .summary-metric span { font-size: 12px; color: var(--muted); }
    .summary-metric.measure { padding-left: 25px; border-left: 1px solid var(--border); }
    .summary-metric.measure strong { color: var(--success); }
    .evaluation-note { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 6px 0 12px; font-size: 11px; color: var(--subtle); }
    .judge-note { display: flex; align-items: center; gap: 6px; color: var(--secondary); }
    .judge-note svg { width: 14px; height: 14px; color: var(--warning); }
    .split-view { display: grid; grid-template-columns: 266px minmax(0, 1fr); gap: 24px; align-items: start; }
    .list-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 2px; }
    .list-heading h2 { font-size: 12px; font-weight: 600; letter-spacing: 0; }
    .list-heading span { font-size: 11px; color: var(--subtle); }
    .issue-list { display: flex; flex-direction: column; gap: 6px; }
    .issue { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; text-align: left; padding: 16px 14px; min-height: 100px; border: 1px solid transparent; border-radius: 8px; background: transparent; position: relative; }
    .issue:hover { background: var(--surface); }
    .issue[aria-pressed="true"] { border-color: var(--border); background: var(--surface); }
    .issue[aria-pressed="true"]::before { content: ""; width: 2px; position: absolute; top: 16px; bottom: 16px; left: -1px; border-radius: 2px; background: var(--accent); }
    .issue-title { font-size: 14px; font-weight: 550; line-height: 1.35; align-self: center; }
    .issue-count { min-width: 32px; align-self: start; font-size: 18px; font-weight: 550; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
    .issue-caption { font-size: 11px; color: var(--muted); grid-column: 1 / -1; line-height: 1.4; }
    .issue-frequency { display: flex; gap: 4px; height: 3px; margin-top: 3px; grid-column: 1 / -1; background: var(--border-soft); border-radius: 3px; overflow: hidden; }
    .issue-frequency span { background: var(--accent); height: 100%; opacity: .55; }
    .list-footer { margin-top: 19px; border-top: 1px solid var(--border-soft); padding: 16px 4px; color: var(--subtle); font-size: 11px; line-height: 1.55; }
    .list-footer strong { display: block; color: var(--muted); font-weight: 500; margin-bottom: 5px; }
    .inspector { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; min-width: 0; }
    .inspector-heading { padding: 14px 22px 12px; }
    .eyebrow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .75px; margin-bottom: 6px; }
    .eyebrow span { color: var(--warning); }
    .inspector-title { font-size: 19px; letter-spacing: -.4px; font-weight: 580; }
    .inspector-subtitle { color: var(--muted); font-size: 11px; margin-top: 5px; }
    .tabs { display: flex; gap: 18px; padding: 0 22px; border-bottom: 1px solid var(--border); }
    .tab { color: var(--muted); font-size: 12px; padding: 9px 0 8px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
    .tab:hover { color: var(--text); }
    .evidence-body { padding: 14px 22px 0; }
    .section-topline { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .section-label { color: var(--muted); font-size: 11px; font-weight: 500; }
    .source-link { display: inline-flex; gap: 5px; align-items: center; padding: 1px 0; color: var(--accent); font-family: var(--mono); font-size: 10px; overflow-wrap: anywhere; text-align: left; }
    .source-link svg { width: 11px; height: 11px; }
    .rule { border-left: 2px solid var(--border); padding: 0 0 0 12px; color: var(--secondary); font-size: 12px; line-height: 1.55; }
    .conversation-section { margin-top: 16px; }
    .conversation-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; color: var(--subtle); font-size: 10px; }
    .conversation-id { font-family: var(--mono); color: var(--muted); }
    .example-controls { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .icon-button { display: inline-grid; place-items: center; width: 27px; height: 27px; border: 1px solid var(--border); border-radius: 5px; color: var(--secondary); }
    .icon-button svg { width: 13px; height: 13px; }
    .icon-button:hover:not(:disabled) { background: var(--elevated); }
    .conversation { border: 1px solid var(--border); border-radius: 7px; overflow: hidden; margin-top: 8px; }
    .message { display: grid; grid-template-columns: 43px 1fr; gap: 12px; padding: 11px 15px; }
    .message + .message { border-top: 1px solid var(--border-soft); }
    .message-speaker { font-size: 10px; color: var(--muted); padding-top: 2px; }
    .message p { font-size: 13px; color: var(--secondary); line-height: 1.6; }
    .message.agent p { color: var(--text); }
    mark { background: var(--quote-highlight); color: var(--text); border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 2px 3px; }
    .rationale { margin-top: 18px; }
    .rationale p { margin-top: 7px; font-size: 12px; color: var(--secondary); line-height: 1.65; }
    .boundary { margin-top: 15px; border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .boundary svg { width: 13px; height: 13px; color: var(--subtle); margin-top: 2px; }
    .inspector-actions { padding: 17px 22px 20px; margin-top: 18px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .local-note { font-size: 10px; color: var(--subtle); margin-top: 7px; text-align: right; }
    .action-right { margin-left: auto; }
    .disputed { border-color: var(--warning); background: var(--warning-wash); color: var(--warning); }
    .back-button { display: none; }
    .scenario-body { padding: 20px 22px; }
    .scenario-notice { display: flex; align-items: flex-start; gap: 9px; color: var(--muted); font-size: 11px; background: var(--page); padding: 11px 12px; border-radius: 6px; border: 1px solid var(--border-soft); margin-bottom: 22px; }
    .scenario-notice svg { width: 14px; height: 14px; color: var(--success); margin-top: 1px; }
    .scenario-field { margin-top: 19px; }
    .scenario-field p { margin-top: 7px; color: var(--secondary); font-size: 13px; line-height: 1.65; }
    .scenario-field pre { padding: 14px; margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); color: var(--secondary); font-size: 11px; line-height: 1.6; background: var(--page); border: 1px solid var(--border-soft); border-radius: 6px; }
    .scenario-placeholder { padding: 32px 22px; }
    .scenario-placeholder h3 { font-size: 16px; }
    .scenario-placeholder p { color: var(--muted); max-width: 380px; font-size: 13px; margin: 9px 0 20px; }
    .state-panel { margin: 44px auto 0; padding: 28px 0; max-width: 750px; }
    .state-symbol { color: var(--accent); width: 40px; height: 40px; margin-bottom: 22px; }
    .state-panel h2 { font-size: 27px; letter-spacing: -.7px; max-width: 570px; }
    .state-panel > p { margin-top: 13px; color: var(--muted); font-size: 14px; max-width: 530px; }
    .entry-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 32px; }
    .entry-choice { text-align: left; border: 1px solid var(--border); border-radius: 9px; padding: 22px; background: var(--surface); display: flex; flex-direction: column; align-items: flex-start; gap: 9px; }
    .entry-choice:hover { border-color: var(--accent); background: var(--elevated); }
    .entry-choice > svg { color: var(--accent); margin-bottom: 8px; }
    .entry-choice strong { font-size: 15px; font-weight: 580; }
    .entry-choice span { font-size: 12px; line-height: 1.55; color: var(--muted); }
    .entry-choice .choice-next { color: var(--accent); margin-top: 13px; display: flex; gap: 6px; align-items: center; }
    .choice-next svg { width: 13px; height: 13px; }
    .state-secondary { margin-top: 26px; font-size: 12px; color: var(--muted); }
    .text-button { color: var(--accent); padding: 2px 0; font-size: inherit; text-align: left; }
    .loading-state { max-width: 560px; margin: 54px auto; }
    .loading-badge { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--accent); margin-bottom: 14px; }
    .loading-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 1.6s ease infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    .loading-state h2 { font-size: 26px; }
    .loading-state > p { color: var(--muted); margin-top: 12px; }
    progress { display: block; width: 100%; height: 5px; margin-top: 30px; border: 0; border-radius: 5px; overflow: hidden; background: var(--border); accent-color: var(--accent); }
    progress::-webkit-progress-bar { background: var(--border); }
    progress::-webkit-progress-value { background: var(--accent); }
    .progress-meta { display: flex; justify-content: space-between; margin-top: 9px; color: var(--muted); font-size: 11px; }
    .loading-actions { display: flex; align-items: center; gap: 18px; margin-top: 26px; flex-wrap: wrap; }
    .error-box { border: 1px solid var(--error); background: var(--error-wash); padding: 18px; border-radius: 8px; color: var(--secondary); margin: 24px 0; }
    .error-box strong { display: block; color: var(--error); font-size: 13px; margin-bottom: 6px; }
    .error-box code { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
    .route-heading { margin-bottom: 25px; }
    .search { display: flex; align-items: center; gap: 10px; max-width: 430px; border: 1px solid var(--border); border-radius: 7px; margin: 23px 0 19px; padding: 10px 12px; background: var(--surface); color: var(--subtle); }
    .search input { background: transparent; border: 0; outline: none; color: var(--text); min-width: 0; width: 100%; font-size: 13px; }
    .search input::placeholder { color: var(--muted); }
    .dialogue-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .dialogue-table th { font-weight: 500; font-size: 11px; text-align: left; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .dialogue-table td { padding: 15px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
    .dialogue-table th:first-child, .dialogue-table td:first-child { padding-left: 0; }
    .dialogue-table .dialogue-quote { color: var(--secondary); margin-top: 4px; font-size: 12px; }
    .dialogue-table .mono { color: var(--muted); font-size: 11px; }
    .status-label { display: inline-flex; align-items: center; gap: 6px; color: var(--warning); font-size: 11px; white-space: nowrap; }
    .status-label::before { content: ""; width: 5px; height: 5px; background: currentColor; border-radius: 50%; }
    .mono { font-family: var(--mono); overflow-wrap: anywhere; }
    .route-footnote { color: var(--subtle); font-size: 11px; margin-top: 17px; }
    .scenario-list { display: flex; flex-direction: column; gap: 12px; }
    .scenario-item { padding: 20px 22px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); }
    .scenario-item-heading { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .scenario-item-heading h2 { font-size: 17px; }
    .scenario-item p { font-size: 13px; color: var(--secondary); margin-top: 13px; }
    .scenario-item small { color: var(--muted); font-size: 11px; }
    .scenario-item-actions { margin-top: 20px; display: flex; align-items: center; gap: 12px; }
    .inline-empty { padding: 36px 28px; border: 1px dashed var(--border); border-radius: 9px; max-width: 640px; }
    .inline-empty h2 { font-size: 19px; }
    .inline-empty p { color: var(--muted); margin: 10px 0 22px; max-width: 470px; }
    .sources-grid { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 23px; }
    .source-block { border: 1px solid var(--border); border-radius: 9px; background: var(--surface); padding: 22px; min-width: 0; }
    .source-block h2 { font-size: 17px; }
    .source-block > p { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .source-file { display: flex; gap: 11px; padding: 18px 0; margin: 17px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .source-file svg { color: var(--accent); margin-top: 3px; }
    .source-file strong { font-family: var(--mono); font-weight: 500; font-size: 12px; overflow-wrap: anywhere; }
    .source-file p { font-size: 11px; color: var(--muted); margin-top: 5px; }
    .source-data-list { margin: 17px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--secondary); }
    .source-data-list li { display: flex; gap: 8px; margin-top: 10px; }
    .source-data-list svg { width: 14px; height: 14px; color: var(--success); margin-top: 2px; }
    .code-context { background: var(--page); border: 1px solid var(--border-soft); border-radius: 7px; margin-top: 18px; padding: 13px 0; font-family: var(--mono); font-size: 11px; }
    .code-line { display: grid; grid-template-columns: 35px 1fr; gap: 10px; padding: 4px 12px; overflow-wrap: anywhere; }
    .code-line span:first-child { color: var(--subtle); text-align: right; user-select: none; }
    .code-line.current { background: var(--accent-wash); color: var(--text); }
    .toast { position: fixed; bottom: 22px; left: calc(50% + 92px); transform: translateX(-50%); z-index: 40; background: var(--elevated); color: var(--text); box-shadow: var(--shadow); border: 1px solid var(--border); border-radius: 8px; padding: 13px 17px; width: max-content; max-width: min(650px, calc(100vw - 32px)); font-size: 12px; display: none; }

    function createScenario() {
      let scenario = selectedScenario();
      if (!scenario) {
        const issue = currentIssue();
        scenario = {key:sampleKey(), issue:state.issue, example:state.example, source:state.source, title:issue.detail, question:currentExample().question, expected:issue.expected, input:issue.input, rule:issue.rule};
        state.scenarios.push(scenario);
        toast('Сценарий создан локально. Он ещё не запускался и не сохранён в Agent Lab.');
      }
      state.tab = 'scenario'; render();
      document.getElementById('scenario-tab')?.focus({preventScroll:true});
    }
    document.addEventListener('click', event => {
      const sourceButton = event.target.closest('[data-source]');
      if (sourceButton) { state.source = sourceButton.dataset.source; state.issue = 0; state.example = 0; state.tab = 'evidence'; state.mobileDetail = false; state.search = ''; render(); return; }
      const routeButton = event.target.closest('[data-route]');
      if (routeButton) { navigate(routeButton.dataset.route); return; }
      const button = event.target.closest('[data-action]');
      if (!button || button.disabled) return;
      const action = button.dataset.action;
      if (action === 'select-issue') { state.issue = Number(button.dataset.index); state.example = 0; state.tab = 'evidence'; state.mobileDetail = true; render({focusDetail:true}); }
      if (action === 'back-to-issues') { state.mobileDetail = false; render(); view.querySelector(`[data-index="${state.issue}"]`)?.focus({preventScroll:true}); }
      if (action === 'prev-example' || action === 'next-example') { state.example += action === 'next-example' ? 1 : -1; state.tab = 'evidence'; render(); toast(`Показан пример ${state.example+1} из ${currentIssue().examples.length}.`); }
      if (action === 'detail-tab') { state.tab = button.dataset.tab; render(); }
      if (action === 'dispute') { const key = sampleKey(); if (state.disputed.has(key)) state.disputed.delete(key); else state.disputed.add(key); render(); toast(state.disputed.has(key) ? 'Вердикт помечен спорным локально. Оценка и счётчики не изменились.' : 'Локальная отметка оспаривания снята.'); }
      if (action === 'create-scenario') createScenario();
      if (action === 'open-rule') navigate('sources');
      if (action === 'return-to-evidence') { state.route = 'analysis'; state.screen = 'results'; state.tab = 'evidence'; state.mobileDetail = true; render({focusDetail:true}); }
      if (action === 'go-scenarios') navigate('scenarios');
      if (action === 'go-analysis' || action === 'show-results') showResults();
      if (action === 'new-check') openCheck(state.source);
      if (action === 'intent-logs') openCheck('logs');
      if (action === 'intent-simulator') openCheck('simulator');
      if (action === 'close-modal') checkDialog.close();
      if (action === 'start-check') { checkDialog.close(); runLocalCheck(state.modalIntent); }
      if (action === 'retry') runLocalCheck(state.source);
      if (action === 'cancel-check') { stopTimer(); state.screen = 'empty'; render(); toast('Демо-проверка отменена. Вы можете начать заново или открыть готовый пример.'); }
      if (action === 'open-dialogue') { state.issue = Number(button.dataset.issue); state.example = Number(button.dataset.example); state.tab = 'evidence'; state.route = 'analysis'; state.screen = 'results'; state.mobileDetail = true; render({focusDetail:true}); }
      if (action === 'open-saved-scenario') { const scenario = state.scenarios[Number(button.dataset.index)]; state.source = scenario.source; state.issue = scenario.issue; state.example = scenario.example; state.tab = 'scenario'; state.route = 'analysis'; state.screen = 'results'; state.mobileDetail = true; render({focusDetail:true}); }
    });
    document.addEventListener('keydown', event => {
      if (!event.target.matches('[role="tab"]')) return;
      if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
      event.preventDefault();
      state.tab = event.key === 'Home' ? 'evidence' : event.key === 'End' ? 'scenario' : state.tab === 'evidence' ? 'scenario' : 'evidence';
      render(); document.getElementById(`${state.tab}-tab`).focus({preventScroll:true});
    });
    document.addEventListener('input', event => {
      if (event.target.id !== 'dialogue-search') return;
      state.search = event.target.value;
      const position = event.target.selectionStart;
      render();
      const input = document.getElementById('dialogue-search');
      input.focus({preventScroll:true});
      if (position !== null && input.type !== 'search') input.setSelectionRange(position, position);
    });
    screenSelect.addEventListener('change', () => { stopTimer(); state.screen = screenSelect.value; state.route = 'analysis'; state.mobileDetail = false; render(); });
    document.getElementById('theme-button').addEventListener('click', () => {
      const light = document.documentElement.dataset.theme !== 'light';
      document.documentElement.dataset.theme = light ? 'light' : 'dark';
      const button = document.getElementById('theme-button');
      button.setAttribute('aria-label', light ? 'Включить тёмную тему' : 'Включить светлую тему');
      button.innerHTML = icon(light ? 'moon' : 'sun');
    });
    document.getElementById('demo-toggle').addEventListener('click', () => {
      const button = document.getElementById('demo-toggle');
      const expanded = button.getAttribute('aria-expanded') !== 'true';
      button.setAttribute('aria-expanded', String(expanded));
      button.closest('.demo-bar').classList.toggle('expanded', expanded);
    });
    checkDialog.addEventListener('click', event => { if (event.target === checkDialog) { const bounds = checkDialog.getBoundingClientRect(); if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) checkDialog.close(); } });
    render();
  </script>
</body>
</html>
