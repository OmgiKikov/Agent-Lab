name: Check
on: [push, pull_request]
jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # A dialogue that never settles must not hold a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The example command adapters and the regression suite are Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      # Every check runs even after an earlier one failed, so a red step never hides a broken package or suite.
      # The test suite is removed for now; the teaching example is the end-to-end smoke run of the product path.
      - name: Teaching example
        if: ${{ !cancelled() }}
        run: node dist/cli.js demo
      # Report A: deterministic contract checks of DISCOVER, VERIFY and the connection exam — stub runtimes, no model or key.
      # It proves the contract on constructed cases, never judge quality on real dialogues (that is report B).
      - name: Semantic proofs
        if: ${{ !cancelled() }}
        run: npx tsx scripts/semantic-proofs.ts
      # One business case end to end on the teaching agent through the Pi tools and `agent-lab evaluate` exit codes.
      - name: Business case
        if: ${{ !cancelled() }}
        run: npx tsx scripts/business-case.ts
      - name: Package contents
        if: ${{ !cancelled() }}
        run: npm pack --dry-run
      - name: Saved regression suite
        if: ${{ !cancelled() }}
        run: node dist/cli.js evaluate --input examples/regression-suite.json --connection examples/connection.json --data-dir .agent-lab/ci --yes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-lab-evidence-${{ matrix.os }}-node${{ matrix.node }}
          path: .agent-lab/ci
          if-no-files-found: ignore
