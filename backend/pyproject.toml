[project]
name = "agent-lab"
version = "1.0.0"
description = "Проверка качества ИИ-агента: аудит логов, тестовые сценарии, LLM-судья, одна метрика качества"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = ["ruff==0.14.0"]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["lab/**/*.py", "bridge/**/*.py", "tests/**/*.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I",
    "B", "UP", "SIM", "C4", "RUF",
    "C90", "PIE", "LOG", "T20",
    "ANN001", "ANN201", "ANN202", "ANN204",
]
# Cyrillic text in strings and comments is intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Prompts are prose: one sentence per line.
"lab/prompts.py" = ["E501"]
# CLI stdout is a machine-readable migration report.
"lab/migrate.py" = ["T201"]
# Flexible mock/fixture call signatures are not exported production contracts.
"tests/**/*.py" = ["ANN001", "ANN201", "ANN202", "ANN204"]
